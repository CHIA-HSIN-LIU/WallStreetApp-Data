name: Auto Update Market Data

# 觸發條件設定
on:
  schedule:
    # 台灣時間 09,10,11,12,13 點 (UTC 1,2,3,4,5 點)，週一 (1) 到週五 (5)
    - cron: '0 1,2,3,4,5 * * 1-5'
    # 台灣時間 13:40 (UTC 5:40)，週一 (1) 到週五 (5)
    - cron: '40 5 * * 1-5'
  # 允許我們在 GitHub 網頁上手動點擊按鈕執行 (方便測試)
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # 1. 取得你 GitHub 倉庫最新的程式碼
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. 安裝 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. 執行你的 Python 爬蟲腳本
      - name: Run Python script
        run: python update_data.py

      # 4. 把更新後的 JSON 檔案自動 Commit 並推播回 GitHub
      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add today_market.json
          # 如果檔案有變動就 commit，沒變動就忽略
          git commit -m "🤖 Auto-update market data" || echo "No changes to commit"
          git push