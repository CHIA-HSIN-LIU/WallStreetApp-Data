# STREAMING_CHUNK:Setting up environment...
steps:
- name: Checkout repository
  uses: actions/checkout@v3

- name: Set up Python
  uses: actions/setup-python@v4
  with:
    python-version: '3.10'

# STREAMING_CHUNK:Installing dependencies and running script...
- name: Install dependencies
  run: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt

- name: Run Python script
  run: python update_data.py

# STREAMING_CHUNK:Committing and pushing the updated JSON...
- name: Commit and push if changed
  run: |
    git config --global user.name 'github-actions[bot]'
    git config --global user.email 'github-actions[bot]@users.noreply.github.com'
    git add today_market.json
    git commit -m "Auto-update real market data" || exit 0
    git push
