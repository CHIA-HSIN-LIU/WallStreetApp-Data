name: Auto Update Market Dataon:schedule:- cron: '0 7 * * *'workflow_dispatch:permissions:contents: writejobs:update-data:runs-on: ubuntu-lateststeps:- name: Checkout repositoryuses: actions/checkout@v3  - name: Set up Python
    uses: actions/setup-python@v4
    with:
      python-version: '3.10'

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Run Python script
    run: python update_data.py

  - name: Commit and push if changed
    run: |
      git config --global user.name 'github-actions[bot]'
      git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      git add today_market.json
      git commit -m "Auto-update real market data" || exit 0
      git push
